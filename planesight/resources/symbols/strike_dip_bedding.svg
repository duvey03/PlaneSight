<?xml version="1.0" encoding="UTF-8"?>
<!-- Strike-and-dip of bedding (inclined), proportioned ~12:7.8 (W:H) so a single
     QGIS marker "size" gives the correct dimensions without stretching.
     Authored pointing UP at rotation 0: long bar = strike, short tick = dip
     direction. In QGIS, set Rotation (data-defined) = "dip_dir". Stroke uses the
     QGIS parametric param(outline) so its colour can be data-driven, and
     param(outline-width) so a wider white copy underneath forms a casing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="78" viewBox="0 0 120 78">
  <g stroke="param(outline) #1a1a1a" stroke-width="param(outline-width) 5"
     stroke-linecap="round" fill="none">
    <!-- strike bar (long line), centred on the measurement point -->
    <line x1="12" y1="39" x2="108" y2="39"/>
    <!-- dip tick (points up at 0 rotation) -->
    <line x1="60" y1="39" x2="60" y2="7"/>
  </g>
</svg>
